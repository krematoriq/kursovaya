<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f0f7e8;
        }

        .site-header {
            background: linear-gradient(135deg, #1a3a2e 0%, #0e2c21 100%);
            color: #f9e7c2;
            padding: 1.2rem 0;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 3px solid #e7b874;
        }

        .header-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .site-title {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(120deg, #f9e7c2, #e7cfa1);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .site-sub {
            font-size: 0.9rem;
            background: rgba(255, 230, 170, 0.18);
            padding: 0.3rem 0.9rem;
            border-radius: 40px;
        }

        .nav-links {
            display: flex;
            gap: 1.8rem;
 margin-left: auto;
        }
        
        .nav-links a {
            color: #f2e0b0;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: 0.2s;
            border-bottom: 2px solid transparent;
            padding-bottom: 4px;
        }
        
        .nav-links a:hover {
            color: #ffefb9;
            border-bottom-color: #e7b874;
        }

        .about-text {
            font-size: 18px;
            color: #333;
            padding: 25px;
            line-height: 1.6;
        }

        img {
            padding: 10px;
        }

        a {
            text-decoration: none;
            padding: 10px;
            color: #8B0000;
            font-weight: bold;
        }

        /* Стили для кнопки выхода из фрейма */
        .exit-frame-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .exit-frame-btn:hover {
            background: #c0392b;
            transform: scale(1.05);
        }
    </style>
    <title>Краснокнижные животные Вологодской области - О нас</title>
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <div class="brand">
                <div class="site-title">Краснокнижные животные</div>
                <div class="site-sub">произведение пользователей</div>
            </div>
            <div class="nav-links">
                <a href="javascript:void(0)" onclick="exitAndGo('Красная книга выбор.html')">Главная</a>
                <a href="javascript:void(0)" onclick="exitAndGo('о нас.html')">О проекте</a>
                <a href="javascript:void(0)" onclick="exitAndGo('помощь.html')">Помощь</a>
            </div>
        </div>
    </header>
   

    
 <script>
    function exitAndGo(url) {
        if (window.top !== window.self) {
            window.top.location.href = url;
        } else {
            window.location.href = url;
        }
        return false;
    }
</script>
</body>
</html>
